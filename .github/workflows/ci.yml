name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shared:
    runs-on: ubuntu-latest
    env:
      PYTHON: python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: JavaScript dependencies
        run: npm ci
      - name: Installed dependency tree
        run: npm ls --all
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Python contract dependencies
        run: pip install 'pydantic>=2.12,<3'
      - name: Build shared packages
        run: npm run build:shared
      - name: Protocol copies
        run: npm run protocol:check
      - name: Semantic contracts
        run: npm run semantic:check
      - name: Validation contracts
        run: npm run validation:check
      - name: Shared package tests
        run: npm run test:shared

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: JavaScript dependencies
        run: npm ci
      - name: Boundary and workflow checks
        run: npm run check:boundaries && npm run test:workflow

  canvas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            canvas/package-lock.json
            extension/package-lock.json
      - name: Root dependencies
        run: npm ci
      - name: Extension dependencies
        working-directory: extension
        run: npm ci
      # Host tests spawn extension/out/test/bootstrap.js. That file is compiled, not committed.
      - name: Compile extension
        working-directory: extension
        run: npm run compile
      - name: Install canvas
        working-directory: canvas
        run: npm ci
      - name: Production dependency audit
        working-directory: canvas
        run: npm audit --omit=dev --audit-level=critical
      - name: Canvas unit tests
        working-directory: canvas
        run: npm test -- --watchAll=false --watch=false --runInBand --ci src/__tests__/canvas src/__tests__/hosts src/__tests__/viewer
      - name: Canvas production build
        working-directory: canvas
        env:
          CI: "true"
          REACT_APP_IDE: "true"
          REACT_APP_AUTH_DISABLED: "true"
        run: npm run build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      - name: Root dependencies
        run: npm ci
      - name: Extension dependencies
        working-directory: extension
        run: npm ci
      - name: Production dependency audit
        working-directory: extension
        run: npm audit --omit=dev --audit-level=critical
      - name: Compile
        working-directory: extension
        run: npm run compile
      - name: Unit tests
        working-directory: extension
        run: npm run test:unit

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin/package-lock.json
            canvas/package-lock.json
      - name: Root dependencies
        run: npm ci
      - name: Plugin dependencies
        run: npm ci --prefix plugin
      - name: Canvas dependencies
        run: npm ci --prefix canvas
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical --prefix plugin
      - name: Plugin checks and unit tests
        run: npm test --prefix plugin
      - name: Source-development package
        run: npm run package:source-development --prefix plugin

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-cpu.txt
            backend/requirements.txt
      - name: Install CPU backend
        run: pip install -r backend/requirements-cpu.txt pytest
      - name: Pytest
        working-directory: backend
        run: python -m pytest -q
