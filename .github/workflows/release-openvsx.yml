name: Release Open VSX

on:
  workflow_run:
    workflows: [Release VSIX]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing Marketplace and numbered GitHub release version to synchronize
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-openvsx
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'tensorviz-org/tensorviz' && vars.RELEASES_ENABLED == 'true' && (
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Execute trusted main code; the originating run supplies its reviewed identity.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download this release run's reviewed version
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: extension-release-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/extension-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish and verify the exact released VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          OPENVSX_VERSION: ${{ inputs.version }}
          RELEASE_RESULT: ${{ github.event_name == 'workflow_run' && format('{0}/extension-release/tensorviz-release.json', runner.temp) || '' }}
          RELEASE_REQUEST_SOURCE: ${{ github.event.workflow_run.head_sha }}
        run: node extension/scripts/sync-openvsx-release.mjs --publish
